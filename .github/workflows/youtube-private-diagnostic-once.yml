name: YouTube Private Upload Diagnostic Once
on:
  push:
    branches: [main]
jobs:
  private-upload-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify YouTube OAuth secrets exist
        run: |
          test -n "$YOUTUBE_CLIENT_ID" || { echo "YOUTUBE_CLIENT_ID is missing"; exit 1; }
          test -n "$YOUTUBE_CLIENT_SECRET" || { echo "YOUTUBE_CLIENT_SECRET is missing"; exit 1; }
          test -n "$YOUTUBE_REFRESH_TOKEN" || { echo "YOUTUBE_REFRESH_TOKEN is missing"; exit 1; }
      - name: Generate tiny private diagnostic video
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x240:d=1 \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac \
            /tmp/youtube-oauth-smoke.mp4
      - name: Upload privately and expose safe API error reason
        run: python scripts/youtube_private_smoke.py /tmp/youtube-oauth-smoke.mp4
