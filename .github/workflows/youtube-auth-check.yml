name: YouTube Authorization Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check refresh credentials without uploading
        run: python scripts/check_youtube_auth.py --output receipts/youtube-auth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-authorization
          path: receipts/youtube-auth.json
          retention-days: 7
